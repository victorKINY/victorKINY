<svg xmlns="http://www.w3.org/2000/svg" width="400" height="190" viewBox="0 0 400 190">
  <style>
    .state-1 { animation: cycle 12s infinite; }
    .state-2 { animation: cycle2 12s infinite; }
    @keyframes cycle { 0%, 45% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes cycle2 { 0%, 45% { opacity: 0; } 50%, 100% { opacity: 1; } }
  </style>
  <rect x="1" y="1" width="398" height="188" rx="6" fill="#0B0D12" stroke="#3B181E" stroke-width="1.5" />

  <!-- Estado A -->
  <g class="state-1">
    <text x="20" y="28" fill="#EF4444" font-family="monospace" font-size="11" font-weight="bold">CLASS IDENTITY</text>
    <text x="380" y="28" text-anchor="end" fill="#9CA3AF" font-family="monospace" font-size="10">SALAMANCA · ES</text>
    <text x="20" y="62" fill="#F9FAFB" font-family="monospace" font-size="22" font-weight="bold">VICTORKINY</text>
    <text x="20" y="84" fill="#FCA5A5" font-family="monospace" font-size="11">COMPANY: KINYKORE // TOOL: KORE</text>
    <line x1="20" y1="104" x2="380" y2="104" stroke="#261317" stroke-width="1" />
    <text x="20" y="128" fill="#D1D5DB" font-family="monospace" font-size="11">STRICT PERFORMANCE AND MODULAR DESIGN.</text>
    <text x="20" y="148" fill="#D1D5DB" font-family="monospace" font-size="11">ZERO BLOAT. FULL DATA OWNERSHIP.</text>
    <text x="20" y="168" fill="#EF4444" font-family="monospace" font-size="11" font-weight="bold">WEB: VICTORKINY.COM</text>
  </g>

  <!-- Estado B -->
  <g class="state-2">
    <text x="20" y="28" fill="#EF4444" font-family="monospace" font-size="11" font-weight="bold">PHILOSOPHY</text>
    <text x="380" y="28" text-anchor="end" fill="#9CA3AF" font-family="monospace" font-size="10">AUTONOMOUS</text>
    <text x="20" y="62" fill="#F9FAFB" font-family="monospace" font-size="22" font-weight="bold">CONTROL TOTAL</text>
    <text x="20" y="84" fill="#FCA5A5" font-family="monospace" font-size="11">SELF-HOSTED & RESILIENT ARCHITECTURES</text>
    <line x1="20" y1="104" x2="380" y2="104" stroke="#261317" stroke-width="1" />
    <text x="20" y="128" fill="#D1D5DB" font-family="monospace" font-size="11">AUTONOMOUS SYSTEMS & AI WORKFLOWS.</text>
    <text x="20" y="148" fill="#D1D5DB" font-family="monospace" font-size="11">BUILT FOR REAL-WORLD CRITICAL TASKS.</text>
    <text x="20" y="168" fill="#EF4444" font-family="monospace" font-size="11" font-weight="bold">STATUS: ACTIVE DEPLOYMENT</text>
  </g>
</svg>
